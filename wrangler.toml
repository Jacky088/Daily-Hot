# Worker 名即线上脚本名：改名会导致「新建 Worker」而不是更新现有的。
# 如需重命名，应先部署到新名称并切换路由/域名，确认无误后再手动删除旧 Worker。
name = "60s"
main = "cf-worker.ts"
compatibility_date = "2025-11-05"
compatibility_flags = [ "nodejs_compat" ]

[assets]
directory = "./public"
# ASSETS 绑定供 cf-worker.ts 把 / 转发到 dist 构建版入口（见 cf-worker.ts 顶部注释）。
# run_worker_first 只拦首页两个入口路径，其余静态文件仍由资产层直接服务、不过 Worker
binding = "ASSETS"
run_worker_first = ["/", "/index.html"]

[observability.logs]
enabled = true
