name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      # 主版本跑 .node-version 钉住的版本，再跑当前 LTS 大版本做前向兼容冒烟；
      # 若 .node-version 升级，同步调整这里的固定值
      matrix:
        node-version: ['22.20.0', '24']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Lint
        run: npx eslint .

      - name: Verify endpoints
        run: pnpm run verify:endpoints

      - name: Format check
        run: pnpm run lint

      - name: Unit tests
        run: pnpm test

      - name: Frontend build is fresh
        run: pnpm run build:frontend:check

  # 依赖安全审计：只扫生产依赖（devDependency 的漏洞不影响线上），
  # 高危及以上直接失败。pnpm audit 只读锁文件，无需安装依赖
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      # 审计接口在 GitHub Runner 上偶发超时（ERR_SOCKET_TIMEOUT），
      # 这类失败与「有没有漏洞」无关，不该把 CI 判红。这里做两件事：
      # 1) 放宽 registry 超时并重试 3 次，扛住短暂的网络抖动；
      # 2) 重试仍失败时区分原因——真扫出高危漏洞照常失败，
      #    只有「审计服务不可达」才降级为 warning 放行
      - name: Audit production dependencies
        shell: bash
        env:
          npm_config_fetch_timeout: 60000
          npm_config_fetch_retries: 3
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            if audit_out=$(pnpm audit --prod --audit-level high 2>&1); then
              echo "$audit_out"
              exit 0
            fi
            echo "$audit_out"
            # 只认网络类错误：漏洞报告（表格 / advisory 链接）不匹配这些关键字
            if grep -Eq 'ERR_SOCKET_TIMEOUT|FetchError|ECONNRESET|ETIMEDOUT|EAI_AGAIN|ERR_PNPM_META_FETCH_FAIL|request to https' <<<"$audit_out"; then
              echo "::warning::pnpm audit 第 ${attempt} 次尝试因网络问题失败，10 秒后重试"
              sleep 10
              continue
            fi
            # 非网络错误：确实扫到了高危漏洞或出现未知故障，必须失败
            exit 1
          done
          echo "::warning::审计服务连续 3 次不可达，本次跳过安全门禁（并非发现漏洞）；网络恢复后请重跑 audit job"
