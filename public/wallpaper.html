<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>必应壁纸 · 今日及往期</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='f' x1='0%25' y1='100%25' x2='0%25' y2='0%25'%3E%3Cstop offset='0%25' stop-color='%23f59e0b'/%3E%3Cstop offset='50%25' stop-color='%23f97316'/%3E%3Cstop offset='100%25' stop-color='%23fb7185'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M12 2c0 0-1.5 2-3 4.5S6.5 11 8 13c-1-.5-2-1.5-2.5-3 0 0-1.5 2-1 4.5C5 17.5 7 20 12 22c5-2 7-4.5 7.5-7.5.5-2.5-1-4.5-1-4.5-.5 1.5-1.5 2.5-2.5 3 1.5-2 1-4.5-.5-7S13.5 4 12 2z' fill='url(%23f)'/%3E%3C/svg%3E" type="image/svg+xml">
<meta name="theme-color" content="#14101a">
<script>
// 主题前置：与主站同一套规则（localStorage.theme 优先，否则跟随系统），
// 抢在首帧前写 data-theme，否则会闪一下裸色
(function () {
  var t = null;
  try { t = localStorage.getItem('theme'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = t;
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = t === 'dark' ? '#14101a' : '#f97316';
})();
</script>
<style>
/* 主题变量：与主站 style.css 保持一致（本页是独立页面，不复用全站样式表，
   避免 body/html 的通用规则干扰这个纯看图布局；口径相同才能「视觉一致」） */
:root {
  --dur-fast: 0.15s;
  --dur-base: 0.25s;
  --dur-slow: 0.45s;
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  /* 底部缩略条高度：由 JS 实测回写。缩略图宽度是流式的，
     写死数值在宽屏下必然与实际高度对不上 */
  --strip-h: 132px;
  /* 「压在照片上」的浮层专用配色：底色固定偏暗、文字固定白色。
     不用主题的 --glass-bg / --text —— 照片颜色不受控，
     「浅色主题 + 浅色照片」会直接失去可读性（信息浮层文字发虚的根因）。
     毛玻璃质感不变，只是把底色换成暗色 */
  --photo-bg: rgba(14, 12, 18, 0.5);
  --photo-border: rgba(255, 255, 255, 0.2);
  --photo-text: #fff;
  --photo-dim: rgba(255, 255, 255, 0.78);
  --photo-accent: #ffb877;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #14101a;
  --bg-grad: radial-gradient(ellipse at top, #1d1526 0%, #141019 60%);
  --text: #f0e9e2;
  --text-dim: #bdb0a2;
  --text-dimmer: #93877b;
  --accent: #f97316;
  --accent-light: #fb923c;
  --accent-bg: rgba(249,115,22,0.12);
  --accent-glow: 0 0 20px rgba(249,115,22,0.18);
  --accent-text: #fb923c;
  --glass-bg: rgba(30, 24, 40, 0.55);
  --glass-border: rgba(255, 255, 255, 0.24);
  --glass-hi: rgba(255, 255, 255, 0.22);
  --glass-lo: rgba(255, 255, 255, 0.05);
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #e4ebf8;
  --bg-grad:
    radial-gradient(circle 700px at 6% 8%, rgba(255, 255, 255, 0.26) 0%, rgba(255, 255, 255, 0.16) 72%, rgba(255, 255, 255, 0.38) 88%, rgba(255, 255, 255, 0.42) 95%, rgba(255, 255, 255, 0.12) 99%, rgba(255, 255, 255, 0) 100%),
    radial-gradient(circle 620px at 104% 34%, rgba(240, 246, 255, 0.26) 0%, rgba(240, 246, 255, 0.15) 72%, rgba(250, 252, 255, 0.38) 88%, rgba(255, 255, 255, 0.42) 95%, rgba(255, 255, 255, 0.12) 99%, rgba(255, 255, 255, 0) 100%),
    radial-gradient(circle 680px at 20% 104%, rgba(255, 252, 248, 0.24) 0%, rgba(255, 252, 248, 0.14) 72%, rgba(255, 254, 251, 0.36) 88%, rgba(255, 255, 255, 0.4) 95%, rgba(255, 255, 255, 0.1) 99%, rgba(255, 255, 255, 0) 100%),
    linear-gradient(180deg, #e8eefb 0%, #dee6f6 52%, #e4ebf9 100%);
  --text: #1c2438;
  --text-dim: #525d7a;
  --text-dimmer: #6a7591;
  --accent: #f97316;
  --accent-light: #ea580c;
  --accent-bg: rgba(249,115,22,0.1);
  --accent-glow: 0 0 20px rgba(249,115,22,0.12);
  --accent-text: #c2410c;
  --glass-bg: rgba(255, 255, 255, 0.46);
  --glass-border: rgba(255, 255, 255, 0.7);
  --glass-hi: rgba(255, 255, 255, 0.9);
  --glass-lo: rgba(255, 255, 255, 0.24);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
/* [hidden] 是 UA 样式里的 display:none，特异性最低，会被下面 .state / .loading
   的 display:flex 直接覆盖掉，导致 hidden 了还显示。这里显式兜住 */
[hidden] { display: none !important; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  background-image: var(--bg-grad);
  background-attachment: fixed;
  color: var(--text);
  line-height: 1.5;
  min-height: 100vh;
  /* 撑满一屏且不滚动：上方大图自适应吃掉剩余高度，底部缩略条固定高度 */
  min-height: 100dvh;
  display: flex; flex-direction: column;
  overflow: hidden;
  transition: background var(--dur-base), color var(--dur-base);
}
/* 毛玻璃通用配方：模糊参数与主站 .card / .topbar 同一档，但底色走 --photo-*
   （固定的暗色玻璃）——这些浮层全部压在照片上，跟随主题会在浅色照片上糊成一片 */
.glass {
  background: var(--photo-bg);
  backdrop-filter: blur(28px) saturate(180%);
  -webkit-backdrop-filter: blur(28px) saturate(180%);
  border: 1px solid var(--photo-border);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.16),
    inset 0 -1px 0 rgba(255, 255, 255, 0.04);
}

/* ---- 顶部条：返回 / 标题 / 计数 ---- */
.bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 2;
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px 14px;
  /* 顶部压一层淡暗渐变：中间那行标题是裸文字，压在浅色壁纸上会看不清 */
  background: linear-gradient(180deg, rgba(8, 6, 12, 0.4), transparent);
}
.bar .back, .bar .counter {
  display: inline-flex; align-items: center; height: 34px; padding: 0 14px;
  border-radius: 10px; font-size: 13px; font-weight: 600;
  color: var(--photo-text); text-decoration: none;
  transition: color var(--dur-fast), border-color var(--dur-fast);
}
.bar .back:hover { border-color: var(--photo-accent); color: var(--photo-accent); }
.bar .title {
  flex: 1; min-width: 0; text-align: center;
  font-size: 14px; font-weight: 700; letter-spacing: 0.2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  /* 它没有毛玻璃底、直接压在图片上，用主题色在浅色壁纸上会糊，固定白字加阴影 */
  color: #fff; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.55);
}
.bar .counter { font-variant-numeric: tabular-nums; color: var(--photo-dim); }
.bar .counter b { color: var(--photo-accent); font-weight: 700; }

/* ---- 全屏大图 ----
   不按 16:9 收口、也不居中：直接铺满整个视口（object-fit: cover）。
   任何窗口尺寸下都不会留白——代价是图的长边会被裁掉一点，
   对壁纸来说可以接受。顶部条 / 信息浮层 / 缩略条都是压在它之上的毛玻璃层 */
.viewer {
  position: fixed; inset: 0; z-index: 0;
  background: #0c0a10;
}
.viewer img {
  width: 100%; height: 100%; display: block; object-fit: cover;
  /* 切换用透明度做「叠化」：两张图叠在一起交替，比直接换 src 平滑得多 */
  transition: opacity var(--dur-slow) var(--ease);
}
.viewer img.fading { opacity: 0; }
.viewer .loading {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 13px; color: var(--text-dim); pointer-events: none;
}
.viewer .info {
  position: absolute; left: 16px; right: 16px;
  /* 抬到缩略条上方——缩略条是压在图片底部的 fixed 浮层，
     info 若还贴着底边就会被它盖住 */
  bottom: calc(var(--strip-h) + 14px);
  display: flex; flex-direction: column; gap: 3px;
  padding: 10px 14px; border-radius: 12px;
  pointer-events: none; max-width: 620px;
}
.viewer .info .d {
  font-size: 12px; font-weight: 700; letter-spacing: 0.4px;
  color: var(--photo-accent); font-variant-numeric: tabular-nums;
}
.viewer .info .t { font-size: 15px; font-weight: 700; color: var(--photo-text); }
.viewer .info .s {
  font-size: 12px; color: var(--photo-dim);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
/* 「查看 4K 原图」放右下角、与左下信息浮层同高：
   原先贴右上角，会和顶部条右侧的计数胶囊（6 / 7）叠在一起。
   样式也换成与站内浮层同档的毛玻璃 */
.viewer .raw {
  position: absolute; right: 16px;
  bottom: calc(var(--strip-h) + 14px);
  display: inline-flex; align-items: center; gap: 5px;
  height: 34px; padding: 0 14px; border-radius: 10px;
  font-size: 12px; font-weight: 700; text-decoration: none;
  color: var(--photo-text);
  background: var(--photo-bg);
  backdrop-filter: blur(28px) saturate(180%);
  -webkit-backdrop-filter: blur(28px) saturate(180%);
  border: 1px solid var(--photo-border);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16);
  transition: border-color var(--dur-fast), box-shadow var(--dur-fast), transform var(--dur-fast);
}
.viewer .raw:hover { border-color: var(--accent); box-shadow: var(--accent-glow); }
.viewer .raw:active { transform: scale(0.97); }

/* 左右翻页箭头：两端都常驻显示。
   原先是 display:none + 只在 hover 时淡入——触屏没有 hover，
   手机端等于完全没有翻页指示。现在默认半透明常显，悬停/按下时变实 */
.viewer .nav {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 44px; height: 44px; border-radius: 50%; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; line-height: 1; padding-bottom: 4px;
  color: var(--photo-text); border: 1px solid var(--photo-border);
  background: var(--photo-bg);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16);
  opacity: 0.62;
  transition: opacity var(--dur-fast), transform var(--dur-fast), border-color var(--dur-fast);
  -webkit-tap-highlight-color: transparent;
}
.viewer .nav.prev { left: 16px; }
.viewer .nav.next { right: 16px; }
@media (hover: hover) {
  .viewer .nav:hover { opacity: 1; border-color: var(--accent); box-shadow: var(--accent-glow); }
}
.viewer .nav:active { opacity: 1; transform: translateY(-50%) scale(0.92); }

/* ---- 底部缩略图条：压在图片上的 fixed 浮层 ----
   高度不写死：缩略图宽度是流式的（随视口宽度变化），写死数值在宽屏下
   会与实际高度脱节 —— 上方信息浮层与「查看原图」靠 --strip-h 让位，
   对不上就会被压在缩略条上（全屏时最明显）。改成由内容撑开，
   再由 JS 把实测高度写回 --strip-h */
.strip {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 2;
  display: flex; align-items: center;
  padding: 0 16px 14px;
  /* 底部压一层淡暗渐变，浅色壁纸上缩略条才立得住 */
  background: linear-gradient(0deg, rgba(8, 6, 12, 0.42), transparent);
}
.thumbs {
  display: flex; gap: 10px; padding: 10px;
  border-radius: 16px;
  overflow-x: auto; scrollbar-width: none;
}
.thumbs::-webkit-scrollbar { display: none; }
.thumb {
  position: relative; flex: 0 0 auto; cursor: pointer;
  width: calc((100% - 60px) / 7); min-width: 96px;
  aspect-ratio: 16 / 9;
  border-radius: 10px; overflow: hidden;
  border: 2px solid transparent; background: var(--glass-lo);
  padding: 0;
  transition: border-color var(--dur-fast), transform var(--dur-fast), opacity var(--dur-fast);
  opacity: 0.62;
}
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb:hover { opacity: 1; transform: translateY(-2px); }
.thumb[aria-current="true"] {
  opacity: 1; border-color: var(--accent);
  box-shadow: var(--accent-glow);
}
/* 缩略图日期角标 */
.thumb .d {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 3px 6px; font-size: 10px; font-weight: 700;
  color: #fff; font-variant-numeric: tabular-nums;
  /* 加深一档：缩略图本身色彩杂乱，0.62 的暗底压在浅色图上仍不够 */
  background: linear-gradient(0deg, rgba(0, 0, 0, 0.78), rgba(0, 0, 0, 0.22) 72%, transparent);
  text-align: center;
}

/* 空态 / 失败态：图片就绪前显示在整屏正中 */
.state {
  position: fixed; inset: 0; z-index: 3;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; color: var(--text-dim);
}

/* ============ 断点 ============
   口径与项目其余部分一致：≤820px 或触摸设备走移动版式。
   --strip-h 是这里的关键——左侧信息浮层与右侧「查看原图」都靠它上移让位，
   缩略条变小之后必须同步改小，否则两者会凭空多出一截间距 */
@media (max-width: 820px), (pointer: coarse) {
  :root { --strip-h: 92px; }
  .bar { padding: 10px 12px 12px; }
  .bar .title { font-size: 13px; }
  /* 右边界让出「查看原图」的宽度：两者同在缩略条上方那一行，
     info 若还铺到 right:12px 就会与它撞在一起 */
  .viewer .info { left: 12px; right: 122px; padding: 9px 12px; border-radius: 10px; }
  .viewer .info .t { font-size: 14px; }
  .viewer .info .s { font-size: 11px; }
  .viewer .raw { right: 12px; height: 32px; padding: 0 12px; font-size: 11px; }
  .viewer .nav { width: 38px; height: 38px; font-size: 21px; padding-bottom: 3px; }
  .viewer .nav.prev { left: 10px; }
  .viewer .nav.next { right: 10px; }
  .strip { padding: 0 12px 12px; }
  .thumbs { padding: 8px; gap: 8px; border-radius: 14px; }
  .thumb { width: 104px; min-width: 104px; border-radius: 8px; }
}
/* 更窄：标题让位给计数（三者同排会挤成一团），信息浮层只留日期与标题 */
@media (max-width: 480px) {
  .bar .title { display: none; }
  .viewer .info .s { display: none; }
  .thumb { width: 88px; min-width: 88px; }
}
</style>
</head>
<body>
  <!-- 全屏大图：铺满视口，任何窗口尺寸都不留白。
       顶部条 / 信息浮层 / 缩略条都是压在它之上的毛玻璃层 -->
  <figure class="viewer" id="viewer" hidden>
    <img id="bigImg" alt="必应壁纸" decoding="async">
    <div class="loading" id="loading">加载中…</div>
    <button class="nav prev" id="prev" type="button" aria-label="上一张">‹</button>
    <button class="nav next" id="next" type="button" aria-label="下一张">›</button>
    <figcaption class="info glass">
      <span class="d" id="infoDate"></span>
      <span class="t" id="infoTitle"></span>
      <span class="s" id="infoSub"></span>
    </figcaption>
    <a class="raw" id="raw" href="#" target="_blank" rel="noopener noreferrer">查看 4K 原图</a>
  </figure>

  <header class="bar">
    <a class="back glass" href="/">← 返回热榜</a>
    <div class="title">必应壁纸 · 今日及往期</div>
    <div class="counter glass"><b id="cur">-</b>&nbsp;/&nbsp;<span id="total">-</span></div>
  </header>

  <div class="state" id="state">正在获取壁纸…</div>

  <div class="strip">
    <div class="thumbs glass" id="thumbs"></div>
  </div>

<script>
(function () {
  var API = '/v2/bing/history?n=7';   // 今日 + 往期，最多 7 张（后端上限 8）
  var $ = function (id) { return document.getElementById(id); };
  var viewer = $('viewer'), stateEl = $('state');
  var bigImg = $('bigImg'), loading = $('loading');
  var infoDate = $('infoDate'), infoTitle = $('infoTitle'), infoSub = $('infoSub');
  var raw = $('raw'), thumbs = $('thumbs'), curEl = $('cur'), totalEl = $('total');
  var stripEl = document.querySelector('.strip');
  var list = [], index = 0, switching = false;

  // 把缩略条的实测高度写回 --strip-h：左侧信息浮层与右侧「查看原图」都靠它上移让位。
  // 缩略图宽度是流式的（calc((100% - 60px)/7)），窗口越宽缩略图越高，
  // 写死数值在宽屏/全屏下必然对不上，浮层就会被压在缩略条上
  function syncStripH() {
    document.documentElement.style.setProperty('--strip-h', Math.round(stripEl.getBoundingClientRect().height) + 'px');
  }
  syncStripH();
  window.addEventListener('resize', syncStripH);
  if (window.ResizeObserver) new ResizeObserver(syncStripH).observe(stripEl);

  // 竖屏 / 窄窗口改用竖版派生图：16:9 的横版图放进竖向容器会被 cover
  // 裁得只剩中间一条。后端已按必应命名规则派生好竖版（源图是 UHD，足够清晰）
  function isPortraitView() { return window.innerHeight > window.innerWidth; }
  function coverOf(it) {
    return (isPortraitView() && it.cover_portrait) ? it.cover_portrait : it.cover;
  }

  function shortDate(d) {
    if (!d) return '';
    var p = d.split('-');
    return p.length === 3 ? (p[1] + '/' + p[2]) : d;
  }

  function paint() {
    var it = list[index];
    if (!it) return;
    curEl.textContent = String(index + 1);
    infoDate.textContent = index === 0 ? (it.date + ' · 今日') : it.date;
    infoTitle.textContent = it.title || '必应每日壁纸';
    infoSub.textContent = it.copyright || '';
    raw.href = it.cover_4k || it.cover;
    Array.prototype.forEach.call(thumbs.children, function (el, i) {
      el.setAttribute('aria-current', i === index ? 'true' : 'false');
    });
    var active = thumbs.children[index];
    if (active && active.scrollIntoView) active.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
  }

  // 叠化切换：先让新图加载完再淡入，避免出现「空白一闪」
  function show(i, instant) {
    if (!list.length) return;
    index = (i + list.length) % list.length;
    var url = coverOf(list[index]);
    if (instant) {
      bigImg.src = url;
      loading.hidden = true;
      paint();
      return;
    }
    if (switching) return;
    switching = true;
    loading.hidden = false;
    var pre = new Image();
    pre.onload = function () {
      bigImg.classList.add('fading');
      setTimeout(function () {
        bigImg.src = url;
        bigImg.onload = function () { bigImg.classList.remove('fading'); loading.hidden = true; switching = false; };
        // 已缓存时 onload 可能不触发，兜底摘掉过渡态
        setTimeout(function () { bigImg.classList.remove('fading'); loading.hidden = true; switching = false; }, 420);
      }, 160);
    };
    pre.onerror = function () { loading.textContent = '这张图加载失败'; switching = false; };
    pre.src = url;
    paint();
  }

  function buildThumbs() {
    thumbs.innerHTML = '';
    list.forEach(function (it, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'thumb';
      b.setAttribute('aria-current', i === 0 ? 'true' : 'false');
      b.title = it.date + ' · ' + (it.title || '');
      var im = document.createElement('img');
      im.src = it.cover; im.alt = ''; im.loading = 'lazy'; im.decoding = 'async';
      var d = document.createElement('span');
      d.className = 'd';
      d.textContent = i === 0 ? '今日' : shortDate(it.date);
      b.appendChild(im); b.appendChild(d);
      b.onclick = function () { show(i); };
      thumbs.appendChild(b);
    });
  }

  // 键盘左右切换（桌面滑片的标配操作）
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') show(index - 1);
    else if (e.key === 'ArrowRight') show(index + 1);
  });
  $('prev').onclick = function () { show(index - 1); };
  $('next').onclick = function () { show(index + 1); };

  // ---- 触摸滑动 / 鼠标拖拽翻页 ----
  // Pointer Events 把触摸与鼠标统一成一套，不必分别写 touch* 和 mouse*：
  // 手机上是手指左右滑，桌面（尤其窄窗口）按住左键拖也能翻页
  var dragX = 0, dragY = 0, dragging = false, moved = false;
  var SWIPE_PX = 60; // 横向位移阈值
  viewer.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return; // 鼠标只认左键
    if (e.target.closest('button, a')) return;               // 箭头/链接交给自己处理
    dragging = true; moved = false;
    dragX = e.clientX; dragY = e.clientY;
    try { viewer.setPointerCapture(e.pointerId); } catch (err) {}
  });
  viewer.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    // 位移超过 10px 即视为「拖动过」，随后的 click 不能再当作「点击看原图」
    if (Math.abs(e.clientX - dragX) > 10 || Math.abs(e.clientY - dragY) > 10) moved = true;
  });
  function endDrag(e) {
    if (!dragging) return;
    dragging = false;
    var dx = e.clientX - dragX, dy = e.clientY - dragY;
    // 横向位移够大、且明显大于纵向才翻页，否则会把「上下滑动」误判成翻页
    if (Math.abs(dx) > SWIPE_PX && Math.abs(dx) > Math.abs(dy) * 1.2) {
      show(index + (dx < 0 ? 1 : -1));
    }
    // 延后一拍再清 moved，让紧随其后的 click 能读到它
    setTimeout(function () { moved = false; }, 0);
  }
  viewer.addEventListener('pointerup', endDrag);
  viewer.addEventListener('pointercancel', function () { dragging = false; });
  viewer.addEventListener('dragstart', function (e) { e.preventDefault(); }); // 禁掉原生图片拖拽

  // 点大图看原图（与卡片上的行为一致）；刚拖动过就不算点击
  bigImg.onclick = function () {
    if (moved) return;
    window.open(list[index].cover_4k || list[index].cover, '_blank', 'noopener');
  };
  bigImg.style.cursor = 'zoom-in';
  bigImg.draggable = false;

  // 方向变化时换用对应版本：手机横竖屏切换、桌面拖窗口跨过方形比例都会命中
  var lastPortrait = isPortraitView();
  window.addEventListener('resize', function () {
    var p = isPortraitView();
    if (p === lastPortrait) return;
    lastPortrait = p;
    if (list.length && !switching) bigImg.src = coverOf(list[index]);
  });

  fetch(API).then(function (r) { return r.json(); }).then(function (j) {
    list = (j && j.data) || [];
    if (!list.length) { stateEl.textContent = '暂时取不到壁纸数据'; return; }
    stateEl.hidden = true;
    viewer.hidden = false;
    totalEl.textContent = String(list.length);
    buildThumbs();
    show(0, true);          // 默认显示今日
    // 预热后几张，切换时几乎即时
    list.slice(1, 4).forEach(function (it) { var p = new Image(); p.src = it.cover; });
  }).catch(function () {
    stateEl.textContent = '壁纸接口请求失败，请稍后再试';
  });
})();
</script>
</body>
</html>
