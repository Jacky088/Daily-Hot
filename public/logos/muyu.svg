<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- 电子木鱼图标（扁平插画风） -->
  <defs>
    <linearGradient id="muyuIconWood" x1="2" y1="5" x2="21" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fee199"/>
      <stop offset="50%" stop-color="#fdbf63"/>
      <stop offset="100%" stop-color="#f29a39"/>
    </linearGradient>
  </defs>

  <!-- 底部微阴影 -->
  <ellipse cx="12" cy="20.5" rx="8.5" ry="1.2" fill="#d97829" opacity="0.3"/>

  <!-- 木鱼主体（闭合轮廓 + 槽口 + 圆孔） -->
  <path d="M 3.2 14.8
           C 3 11.2  6.5 7.2  11.5 7.2
           C 16.5 7.2  19.5 9.5  20.2 12.8
           C 20.6 14.5  21.2 15.6  22.2 16.5
           C 23.2 17.5  23 19  21.6 19.6
           C 19.5 20.2  9.5 20.2  5.5 19.6
           C 3.8 19.3  3.1 17.5  3.2 15.6
           L 8.5 15.6
           A 1.8 1.8 0 1 0 8.5 14.8
           Z"
        fill="url(#muyuIconWood)"
        stroke="#822b17"
        stroke-width="1.3"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- 顶部圆弧高光 -->
  <path d="M 15 8.6 C 17.2 9.4 18.6 10.6 19 12.2"
        stroke="#ffffff"
        stroke-width="1"
        stroke-linecap="round"
        opacity="0.9"/>

  <!-- 小木槌（斜置于右上） -->
  <g transform="rotate(32 17 5)">
    <line x1="16.5" y1="5" x2="23" y2="5" stroke="#822b17" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="16.5" y1="5" x2="23" y2="5" stroke="#fed88b" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="15.2" cy="5" r="2.4" fill="#fdbf63" stroke="#822b17" stroke-width="1.2"/>
    <circle cx="14.6" cy="4.4" r="0.6" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
