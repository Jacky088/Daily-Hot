<script>
// 主题/壁纸前置：开屏遮罩在 init() 之前渲染，必须提前设置 data-theme，否则主题变量未生效会闪裸色；
// 壁纸关闭态同理要抢在首帧前打上，否则 app.js 执行前壁纸会闪一下再消失。
// 主题默认跟随系统外观、壁纸默认关闭；两处都只有用户手动切换过的偏好才覆盖默认值
(function () {
  // 主题：用户手动切换过就用其偏好，否则跟随系统（桌面/移动端同为 prefers-color-scheme）
  var t = null;
  try { t = localStorage.getItem('theme'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = t;
  // 地址栏主题色同步：首屏就与主题一致，避免移动端出现一闪而过的异色状态栏
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = t === 'dark' ? '#14101a' : '#f97316';
  // 默认关闭壁纸：只有显式存过 '0'（用户开启过）才不加关闭类；
  // localStorage 不可用时同样按默认关闭处理，避免壁纸意外冒出来
  var wpOff = true;
  try { wpOff = localStorage.getItem('wallpaper-off') !== '0'; } catch (e) {}
  if (wpOff) document.documentElement.classList.add('wallpaper-off');
})();
</script>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="wallpaper-bg" id="wallpaperBg" aria-hidden="true" hidden></div>

<!-- 氛围背景：壁纸关闭时（默认态）铺在 body 渐变之上的一层「大块流动光」。
     四颗失焦大光斑在视口里缓慢漂移缩放，给静态底色补上景深与时间感。
     纯装饰：fixed 不占布局、pointer-events:none 不挡点击、aria-hidden 不进读屏；
     壁纸开启时整层由 CSS 淡出（壁纸本来就是主角，两套背景叠着只会脏）。
     光斑位置/尺寸/动画参数全部写在 style.css 的「氛围背景」一节 -->
<div class="aura" id="aura" aria-hidden="true">
  <i class="aura-b aura-b1"></i>
  <i class="aura-b aura-b2"></i>
  <i class="aura-b aura-b3"></i>
  <i class="aura-b aura-b4"></i>
</div>

<!-- 开屏：毛玻璃遮罩 + 居中火焰（尺寸随屏幕自适应），首批数据就绪后由 app.js 渐隐移除 -->
<div class="splash" id="splash" aria-hidden="true">
  <svg class="splash-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="flameSplash" x1="0%" y1="100%" x2="0%" y2="0%">
        <stop offset="0%" stop-color="#f59e0b"/>
        <stop offset="50%" stop-color="#f97316"/>
        <stop offset="100%" stop-color="#fb7185"/>
      </linearGradient>
    </defs>
    <path d="M12 2c0 0-1.5 2-3 4.5S6.5 11 8 13c-1-.5-2-1.5-2.5-3 0 0-1.5 2-1 4.5C5 17.5 7 20 12 22c5-2 7-4.5 7.5-7.5.5-2.5-1-4.5-1-4.5-.5 1.5-1.5 2.5-2.5 3 1.5-2 1-4.5-.5-7S13.5 4 12 2z" fill="url(#flameSplash)"/>
  </svg>
</div>

<div class="app-shell" id="appShell">

  <!-- 左侧导航栏：桌面常驻固定，窄屏收成抽屉（.sidebar-open 打开）。
       分类导航 #catNav 整块搬进这里——分类点击、目录手风琴、滚动高亮等既有逻辑
       全部复用，只是把「横向 pill 行」在样式上改写成「纵向列表」 -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-head">
      <div class="logo">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="flame" x1="0%" y1="100%" x2="0%" y2="0%">
              <stop offset="0%" stop-color="#f59e0b"/>
              <stop offset="50%" stop-color="#f97316"/>
              <stop offset="100%" stop-color="#fb7185"/>
            </linearGradient>
          </defs>
          <path d="M12 2c0 0-1.5 2-3 4.5S6.5 11 8 13c-1-.5-2-1.5-2.5-3 0 0-1.5 2-1 4.5C5 17.5 7 20 12 22c5-2 7-4.5 7.5-7.5.5-2.5-1-4.5-1-4.5-.5 1.5-1.5 2.5-2.5 3 1.5-2 1-4.5-.5-7S13.5 4 12 2z" fill="url(#flame)"/>
        </svg>
        <span class="sb-brand">
          <b class="text">今日热榜</b>
          <i class="subtitle">聚合全网热点</i>
        </span>
      </div>
      <button class="sb-close" id="sbClose" type="button" aria-label="收起菜单">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <!-- 天气卡的落点之一：侧栏/抽屉里品牌文字（Logo）之下、菜单之上。
         卡片本身不写在这里——它由 app.js 按视口宽度在右栏(#railWeather)与这里之间搬运，
         同一时刻只存在于一个宿主里（见 placeWeatherCard）。
         >1180 它在右栏；≤1180（中间视口 900~1180px 与移动抽屉 ≤900px）位于侧栏/抽屉 Logo 正下方展示。
         宿主用 display:contents，所以卡片是 .sidebar 的直接 flex 子项：
         宽度自动跟菜单对齐（两边都是 stretch 撑满同一栏），卡片不在时也不占位 -->
    <div class="sb-weather" id="sbWeather"></div>

    <nav class="cat-nav" id="catNav"></nav>

    <div class="sb-foot">
      <button class="sb-theme" id="themeToggle" type="button" title="切换主题" aria-label="切换主题">

        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <span class="sb-theme-label">深色模式</span>
        <i class="sb-switch" aria-hidden="true"></i>
      </button>
      <p class="sb-copy">© 2026 今日热榜<br><a href="https://mmcoo.de" target="_blank" rel="noopener">木木的主页</a> · 数据来源 <a href="https://github.com/vikiboss/60s" target="_blank" rel="noopener">vikiboss/60s</a></p>
    </div>
  </aside>

  <div class="app-main">
    <div class="topbar">
      <div class="header">
        <!-- 窄屏专用：展开左侧抽屉 -->
        <button class="sb-toggle" id="sbToggle" type="button" aria-label="展开菜单" aria-expanded="false">

        </button>
        <!-- 搜索框：右侧只露一个引擎图标——它就是「当前引擎」本身（默认必应），
             点开在下方弹出候选列表切换，与综合搜索引擎的选法一致。
             回车或点放大镜新标签打开结果页。
             紧跟 logo 之后（搜索框在前、时钟在后），放不进 .header-right 内部——

        <form class="site-search" id="siteSearch" role="search">

          <button class="ss-clear" id="ssClearBtn" type="button" aria-label="清空输入" hidden title="清空">✕</button>
          <!-- 引擎按钮：两只图标都在 DOM 里，由按钮上的 data-engine 决定显示哪只

          <button class="ss-engine" id="ssEngineBtn" type="button" data-engine="bing"

              <svg data-engine-icon="google" viewBox="0 0 48 48">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>

                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>

              </svg>
            </span>
            <svg class="ss-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>

              <span class="ss-item-name">必应</span>

              </svg></span>

          </div>
          <!-- 站内即时检索与模糊搜源智能浮层 -->
          <div class="ss-suggest" id="ssSuggest" role="listbox" aria-label="站内即时搜索与快捷直达" hidden></div>
        </form>
        <div class="header-right">

               窗口放不下时整组一起换行到第二行（第一行留 logo + 搜索框）。
               clocks 必须是 .header-right 的子元素——fitClocks 正是用

          <div class="clock clock-desktop" id="clockDesktop" role="button" tabindex="0" title="点击查看万年历 · 农历与节假日" aria-label="万年历时钟胶囊，点击查看农历与节假日">
            <div class="clock-fill" data-fill="desktop"></div>

            <div class="clock-bubbles" aria-hidden="true"><i class="bubble"></i><i class="bubble"></i><i class="bubble"></i><i class="bubble"></i></div>

            <div class="clock-fill" data-fill="mobile"></div>
            <div class="clock-bubbles" aria-hidden="true"><i class="bubble"></i><i class="bubble"></i><i class="bubble"></i><i class="bubble"></i></div>
            <span class="clock-dot"></span>
            <span class="clock-date" id="clockDateMobile">今天是 ----年-月-日 周-</span>
            <span class="clock-time" id="clockTimeMobile">--:--:--</span>
          </div>
          <a href="https://github.com/Jacky088/Daily-Hot" target="_blank" rel="noopener" title="GitHub" class="github-link" aria-label="GitHub 仓库">

          </a>
          <!-- 壁纸开关：默认关闭（.wp-off 带斜线图标），点击开启后拉取壁纸并换成 .wp-on 风景图标 -->
          <button class="icon-btn wallpaper-toggle" id="wallpaperToggle" type="button" title="开启壁纸" aria-label="开启壁纸" aria-pressed="false">
            <svg class="wp-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            <svg class="wp-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/><line x1="3" y1="3" x2="21" y2="21"/></svg>
          </button>
          <button class="icon-btn" id="btnRefreshAll" type="button" title="全部刷新" aria-label="全部刷新"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg></button>
        </div>
      </div>
    </div>

    <div class="layout">
      <div class="main" id="main"></div>
      <!-- 右侧信息栏：仅「今日热榜」首页显示（热搜平台导航 + 热门话题） -->
      <aside class="rail" id="rail" hidden></aside>
    </div>

  </div>
</div>

<!-- 抽屉遮罩：窄屏下侧边栏展开时铺满内容区，点击收起 -->
<div class="sb-mask" id="sbMask" hidden></div>

<!-- 下拉刷新指示器：手势拖出时跟随，松手回弹/触发刷新 -->
<div class="ptr-indicator" id="ptrIndicator" aria-hidden="true"><span class="ptr-spin"></span></div>

<!-- 万年历 / 农历 / 节假日弹窗 -->
<div class="cal-modal-overlay" id="calModalOverlay" hidden>
  <div class="cal-modal-card" id="calModalCard" role="dialog" aria-modal="true" aria-labelledby="calModalTitle">
    <div class="cal-modal-head">
      <div class="cal-modal-title" id="calModalTitle">
        <span class="cal-modal-icon"><img class="emo" src="/emoji/1f4c5.svg" alt="📅" draggable="false"></span>
        <span class="cal-modal-text">万年历 · 农历与节假日</span>
      </div>
      <button class="cal-modal-close" id="calModalClose" type="button" aria-label="关闭弹窗" title="关闭 (Esc)">✕</button>
    </div>
    <div class="cal-modal-body" id="calModalBody"></div>
  </div>
</div>

<!-- 统一 emoji 渲染层：必须在 app.js 之前加载，它会接管 innerHTML 等写入出口，
     把 emoji 统一换成 /emoji/*.svg 本地图标（详见 emoji.js 顶部说明） -->
<script src="/emoji.js"></script>
<script src="/app.js"></script>
</body>
</html>
