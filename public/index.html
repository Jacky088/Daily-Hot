<meta property="og:title" content="每日热榜 · 一站看完天下事">
<meta property="og:description" content="聚合微博、知乎、B站、抖音、Hacker News 等 40+ 数据源的热榜聚合面板">

<noscript><style>#splash { display: none; }</style></noscript>
<script>
// 主题/壁纸前置：开屏遮罩在 init() 之前渲染，必须提前设置 data-theme，否则主题变量未生效会闪裸色；
// 壁纸关闭态同理要抢在首帧前打上，否则 app.js 执行前壁纸会闪一下再消失。
// 主题默认跟随系统外观、壁纸默认关闭；两处都只有用户手动切换过的偏好才覆盖默认值
(function () {
  // 主题：用户手动切换过就用其偏好，否则跟随系统（桌面/移动端同为 prefers-color-scheme）
  var t = null;
  try { t = localStorage.getItem('theme'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = t;
  // 地址栏主题色同步：首屏就与主题一致，避免移动端出现一闪而过的异色状态栏
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = t === 'dark' ? '#14101a' : '#f97316';
  // 默认关闭壁纸：只有显式存过 '0'（用户开启过）才不加关闭类；
  // localStorage 不可用时同样按默认关闭处理，避免壁纸意外冒出来
  var wpOff = true;
  try { wpOff = localStorage.getItem('wallpaper-off') !== '0'; } catch (e) {}
  if (wpOff) document.documentElement.classList.add('wallpaper-off');
})();
</script>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="wallpaper-bg" id="wallpaperBg" aria-hidden="true" hidden></div>

<!-- 开屏：毛玻璃遮罩 + 居中火焰（尺寸随屏幕自适应），首批数据就绪后由 app.js 渐隐移除 -->
<div class="splash" id="splash" aria-hidden="true">
  <svg class="splash-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="flameSplash" x1="0%" y1="100%" x2="0%" y2="0%">
        <stop offset="0%" stop-color="#f59e0b"/>
        <stop offset="50%" stop-color="#f97316"/>
        <stop offset="100%" stop-color="#fb7185"/>
      </linearGradient>
    </defs>
    <path d="M12 2c0 0-1.5 2-3 4.5S6.5 11 8 13c-1-.5-2-1.5-2.5-3 0 0-1.5 2-1 4.5C5 17.5 7 20 12 22c5-2 7-4.5 7.5-7.5.5-2.5-1-4.5-1-4.5-.5 1.5-1.5 2.5-2.5 3 1.5-2 1-4.5-.5-7S13.5 4 12 2z" fill="url(#flameSplash)"/>
  </svg>
</div>

<div class="topbar">
  <div class="header">
    <div class="header-left">
      <div class="logo">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="flame" x1="0%" y1="100%" x2="0%" y2="0%">
              <stop offset="0%" stop-color="#f59e0b"/>
              <stop offset="50%" stop-color="#f97316"/>
              <stop offset="100%" stop-color="#fb7185"/>
            </linearGradient>
          </defs>
          <path d="M12 2c0 0-1.5 2-3 4.5S6.5 11 8 13c-1-.5-2-1.5-2.5-3 0 0-1.5 2-1 4.5C5 17.5 7 20 12 22c5-2 7-4.5 7.5-7.5.5-2.5-1-4.5-1-4.5-.5 1.5-1.5 2.5-2.5 3 1.5-2 1-4.5-.5-7S13.5 4 12 2z" fill="url(#flame)"/>
        </svg>
        <span class="text">每日热榜</span>
        <span class="subtitle">一站看完天下事</span>
      </div>
      <div class="search-wrap">

        <input type="text" id="search" placeholder="搜索接口…" aria-label="搜索接口" autocomplete="off">
        <button class="search-clear" id="searchClear" type="button" title="清空搜索" aria-label="清空搜索">×</button>
      </div>
      <!-- 桌面端时钟：搜索框右侧 -->
      <div class="clock clock-desktop" id="clockDesktop" title="当前时间">

        <span class="clock-dot"></span>
        <span class="clock-date" id="clockDateDesktop">今天是 ----年-月-日 周-</span>
        <span class="clock-time" id="clockTimeDesktop">--:--:--</span>
      </div>
    </div>
    <div class="header-right">
      <!-- 移动端时钟：github 图标左侧、左对齐 -->
      <div class="clock clock-mobile" id="clockMobile" title="当前时间">
        <div class="clock-fill" data-fill="mobile"></div>
        <span class="clock-dot"></span>
        <span class="clock-date" id="clockDateMobile">今天是 ----年-月-日 周-</span>
        <span class="clock-time" id="clockTimeMobile">--:--:--</span>
      </div>
      <a href="https://github.com/Jacky088/Daily-Hot" target="_blank" rel="noopener" title="GitHub" class="github-link" aria-label="GitHub 仓库">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
      </a>
      <button class="theme-toggle" id="themeToggle" title="切换主题" aria-label="切换主题">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
      <!-- 壁纸开关：默认关闭（.wp-off 带斜线图标），点击开启后拉取壁纸并换成 .wp-on 风景图标 -->
      <button class="icon-btn wallpaper-toggle" id="wallpaperToggle" type="button" title="开启壁纸" aria-label="开启壁纸" aria-pressed="false">
        <svg class="wp-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        <svg class="wp-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/><line x1="3" y1="3" x2="21" y2="21"/></svg>
      </button>
      <button class="icon-btn" id="btnRefreshAll" type="button" title="全部刷新" aria-label="全部刷新"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg></button>
    </div>
  </div>
</div>
