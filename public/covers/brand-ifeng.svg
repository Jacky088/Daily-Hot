<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 110" width="160" height="110">
  <defs>
    <linearGradient id="bg-ifeng" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D41B23"/>
      <stop offset="50%" stop-color="#B8141B"/>
      <stop offset="100%" stop-color="#80060B"/>
    </linearGradient>
    <radialGradient id="highlight-ifeng" cx="30%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow-ifeng" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#4a0003" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="160" height="110" rx="12" fill="url(#bg-ifeng)"/>
  <rect width="160" height="110" rx="12" fill="url(#highlight-ifeng)"/>

  <!-- Radiant Golden Meridian Rings -->
  <circle cx="80" cy="36" r="32" fill="none" stroke="#FFD700" stroke-opacity="0.15" stroke-width="1.2"/>
  <circle cx="80" cy="36" r="48" fill="none" stroke="#FFD700" stroke-opacity="0.08" stroke-width="1.2"/>

  <!-- Phoenix Golden Double Swirl Logo (Centered) -->
  <g transform="translate(64, 18)" filter="url(#shadow-ifeng)">
    <!-- Outer Golden Ring -->
    <circle cx="16" cy="16" r="15" fill="#FFE57F" fill-opacity="0.2" stroke="#FFD700" stroke-width="1.5"/>
    <!-- Swirl Tail 1 -->
    <path d="M16,4 C22,4 28,10 28,16 C28,22 22,28 16,28 C19,25 21,21 21,17 C21,11 16,7 11,8 C13,5 14.5,4 16,4 Z" fill="#FFF275"/>
    <!-- Swirl Tail 2 -->
    <path d="M16,28 C10,28 4,22 4,16 C4,10 10,4 16,4 C13,7 11,11 11,15 C11,21 16,25 21,24 C19,27 17.5,28 16,28 Z" fill="#FFD700"/>
    <!-- Center Core Eye -->
    <circle cx="16" cy="16" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Brand Title -->
  <text x="80" y="86" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="1.5">凤凰热榜</text>
  <text x="80" y="98" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" fill="#FFD700" fill-opacity="0.9" letter-spacing="1">IFENG NEWS</text>
</svg>
