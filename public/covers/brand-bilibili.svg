<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 110" width="160" height="110">
  <defs>
    <linearGradient id="bg-bili" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#23ADE5"/>
      <stop offset="50%" stop-color="#00A1D6"/>
      <stop offset="100%" stop-color="#0088C2"/>
    </linearGradient>
    <radialGradient id="highlight-bili" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow-bili" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#004e70" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="160" height="110" rx="12" fill="url(#bg-bili)"/>
  <rect width="160" height="110" rx="12" fill="url(#highlight-bili)"/>

  <!-- Cute floating sparkles and broadcast bubbles -->
