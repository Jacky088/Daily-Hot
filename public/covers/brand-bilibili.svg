  <circle cx="134" cy="24" r="5" fill="#FFFFFF" fill-opacity="0.12"/>
  <circle cx="126" cy="44" r="2.5" fill="#FFFFFF" fill-opacity="0.18"/>
  <polygon points="135,75 137,79 141,80 137,82 135,86 133,82 129,80 133,79" fill="#FFFFFF" fill-opacity="0.2"/>

