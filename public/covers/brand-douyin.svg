<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 110" width="160" height="110">
  <defs>
    <linearGradient id="bg-douyin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0F1A"/>
      <stop offset="50%" stop-color="#161824"/>
      <stop offset="100%" stop-color="#1C1F2E"/>
    </linearGradient>
    <radialGradient id="cyan-glow" cx="15%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pink-glow" cx="85%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#FE2C55" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FE2C55" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow-douyin" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
