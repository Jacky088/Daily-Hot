<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 110" width="160" height="110">
  <defs>
    <linearGradient id="bg-baidu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E5BFF"/>
      <stop offset="50%" stop-color="#1A3CD6"/>
      <stop offset="100%" stop-color="#0E25A6"/>
    </linearGradient>
    <radialGradient id="highlight-baidu" cx="30%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow-baidu" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#051257" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="160" height="110" rx="12" fill="url(#bg-baidu)"/>
  <rect width="160" height="110" rx="12" fill="url(#highlight-baidu)"/>

  <!-- Search Radar Concentric Rings -->
  <circle cx="80" cy="36" r="30" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>
  <circle cx="80" cy="36" r="48" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1.5"/>

