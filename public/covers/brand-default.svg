<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 110" width="160" height="110">
  <defs>
    <linearGradient id="bg-default" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E3A"/>
      <stop offset="100%" stop-color="#FF8364"/>
    </linearGradient>
    <radialGradient id="highlight-default" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow-default" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#801c05" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="160" height="110" rx="12" fill="url(#bg-default)"/>
  <rect width="160" height="110" rx="12" fill="url(#highlight-default)"/>

  <!-- Flame Icon (Centered) -->
  <g transform="translate(64, 18) scale(1.35)" filter="url(#shadow-default)">
    <path fill="#FFFFFF" d="M12 23c6.075 0 11-4.925 11-11 0-4.04-2.19-7.57-5.46-9.5-.47-.28-1.07.08-1.04.62.24 3.7-2.31 6.88-5.5 6.88-2.21 0-4-1.79-4-4 0-.85.27-1.63.73-2.28.32-.45-.04-1.07-.58-.95C4.24 3.48 2 6.98 2 11.08 2 17.66 6.48 23 12 23z"/>
  </g>

  <!-- Brand Title -->
  <text x="80" y="86" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="1.5">今日热榜</text>
  <text x="80" y="98" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" fill="#FFFFFF" fill-opacity="0.8" letter-spacing="1">DAILY HOT</text>
</svg>
